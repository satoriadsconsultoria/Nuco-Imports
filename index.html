<title>Nuco Imports | Produtos na Shopee</title>

<style>
:root{color-scheme:light;--bg:#ffffff;--surface:#ffffff;--text:#221719;--muted:#6e5c60;--accent:#d9081b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.6 Arial,Helvetica,sans-serif}
.wrap{width:min(1080px,calc(100% - 40px));margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px 0;border-bottom:1px solid #eadde0}
.brand{display:flex;align-items:center;gap:16px}.brand img{display:block;width:88px;height:88px;object-fit:contain;border-radius:16px}.brand span{font-size:.875rem;font-weight:700;letter-spacing:.18em;color:var(--accent)}.channel{font-size:.875rem;color:var(--muted)}
.intro{padding:64px 0 36px;max-width:680px}.eyebrow{margin:0 0 12px;color:var(--accent);font-size:.875rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
h1{font-size:clamp(2.25rem,6vw,4.5rem);line-height:1.04;letter-spacing:-.055em;margin:0 0 22px}h1 span{color:var(--accent)}
.intro p:last-child{color:var(--muted);max-width:480px;margin:0;font-size:1.125rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:56px}
.card{background:var(--surface);border:1px solid #eadde0;border-radius:18px;box-shadow:0 8px 24px #60000d08;overflow:hidden;display:flex;flex-direction:column}
.photo{aspect-ratio:4/3;display:grid;place-items:center;background:#fff1f3;position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:3.5rem;letter-spacing:-.06em;font-weight:800;color:#d9081b}
.number{position:absolute;top:14px;left:16px;font-size:.875rem;color:var(--muted)}
.body{padding:22px;flex:1;display:flex;flex-direction:column}h2{font-size:1.125rem;line-height:1.4;margin:0 0 18px}
.cta{display:block;margin-top:auto;background:var(--accent);color:#ffffff;text-align:center;text-decoration:none;font-weight:700;border:0;border-radius:9px;padding:13px 16px;font-size:1rem;line-height:1.5}
a.cta:hover{background:#b50617}a:focus-visible{outline:3px solid #d9081b;outline-offset:4px}
.cta[disabled]{background:#d9081b;color:#ffffff;cursor:default}
footer{border-top:1px solid #eadde0;padding:24px 0 32px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:.875rem}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{padding-top:44px}}
@media(max-width:480px){.wrap{width:calc(100% - 32px)}header{padding:22px 0}.channel{max-width:100px;text-align:right}.grid{grid-template-columns:1fr;gap:18px}.intro{padding:36px 0 28px}footer{flex-direction:column;gap:8px}.photo{aspect-ratio:16/10}}
@media(prefers-reduced-motion:no-preference){a.cta{transition:background .15s}}
</style>
</head>
