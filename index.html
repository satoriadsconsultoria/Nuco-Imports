<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Encontre os produtos da Nuco Imports e confira os detalhes na Shopee.">
<meta name="theme-color" content="#101114">
<title>Nuco Imports | Produtos na Shopee</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6b35'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='24' fill='%23101114'%3EN%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#101114;--surface:#1b1d22;--text:#f7f7f8;--muted:#b6b8c0;--accent:#ff6b35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.6 Arial,Helvetica,sans-serif}
.wrap{width:min(1080px,calc(100% - 40px));margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px 0;border-bottom:1px solid #34363d}
.brand{font-size:1.25rem;font-weight:800;letter-spacing:-.04em}.brand span{color:var(--accent)}.channel{font-size:.875rem;color:var(--muted)}
.intro{padding:64px 0 36px;max-width:680px}.eyebrow{margin:0 0 12px;color:var(--accent);font-size:.875rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
h1{font-size:clamp(2.25rem,6vw,4.5rem);line-height:1.04;letter-spacing:-.055em;margin:0 0 22px}h1 span{color:var(--accent)}
.intro p:last-child{color:var(--muted);max-width:480px;margin:0;font-size:1.125rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:56px}
.card{background:var(--surface);border:1px solid #34363d;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.photo{aspect-ratio:4/3;display:grid;place-items:center;background:#24262d;position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:3.5rem;letter-spacing:-.06em;font-weight:800;color:#838692}
.number{position:absolute;top:14px;left:16px;font-size:.875rem;color:var(--muted)}
.body{padding:22px;flex:1;display:flex;flex-direction:column}h2{font-size:1.125rem;line-height:1.4;margin:0 0 18px}
.cta{display:block;margin-top:auto;background:var(--accent);color:#17100c;text-align:center;text-decoration:none;font-weight:700;border:0;border-radius:9px;padding:13px 16px;font-size:1rem;line-height:1.5}
a.cta:hover{background:#ff8558}a:focus-visible{outline:3px solid white;outline-offset:4px}
.cta[disabled]{background:#34363d;color:#b6b8c0;cursor:default}
footer{border-top:1px solid #34363d;padding:24px 0 32px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:.875rem}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{padding-top:44px}}
@media(max-width:480px){.wrap{width:calc(100% - 32px)}header{padding:22px 0}.channel{max-width:100px;text-align:right}.grid{grid-template-columns:1fr;gap:18px}.intro{padding:36px 0 28px}footer{flex-direction:column;gap:8px}.photo{aspect-ratio:16/10}}
@media(prefers-reduced-motion:no-preference){a.cta{transition:background .15s}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">NUCO<span> IMPORTS</span></div><div class="channel">Produtos na Shopee</div></header>
<main>
<section class="intro" aria-labelledby="title"><p class="eyebrow">Seleção Nuco Imports</p><h1 id="title">Seu próximo<br><span>achado está aqui.</span></h1><p>Escolha um produto e confira os detalhes na Shopee.</p></section>
<section class="grid" id="products" aria-label="Produtos"></section>
<noscript><p>Ative o JavaScript para visualizar os produtos.</p></noscript>
</main>
<footer><span>Nuco Imports</span><span>Compras e pagamentos realizados na Shopee.</span></footer>
</div>
<script>
// Preencher com os seis produtos reais antes da publicação.
// image: caminho local da foto; url: link exato enviado pelo cliente.
const products = [
  {name:"Produto 01",image:"",url:""},
  {name:"Produto 02",image:"",url:""},
  {name:"Produto 03",image:"",url:""},
  {name:"Produto 04",image:"",url:""},
  {name:"Produto 05",image:"",url:""},
  {name:"Produto 06",image:"",url:""}
];
const grid=document.getElementById("products");
products.forEach((product,index)=>{
  const card=document.createElement("article");card.className="card";
  const photo=document.createElement("div");photo.className="photo";
  const number=document.createElement("span");number.className="number";number.textContent=String(index+1).padStart(2,"0");photo.append(number);
  if(product.image){const img=document.createElement("img");img.src=product.image;img.alt=product.name;img.loading="lazy";photo.append(img);}
  else{const placeholder=document.createElement("span");placeholder.className="placeholder";placeholder.textContent="NUCO";placeholder.setAttribute("aria-hidden","true");photo.append(placeholder);}
  const body=document.createElement("div");body.className="body";
  const title=document.createElement("h2");title.textContent=product.name;body.append(title);
  let link;
  if(product.url){link=document.createElement("a");link.href=product.url;link.target="_blank";link.rel="noopener noreferrer sponsored";link.textContent="Ver na Shopee";link.setAttribute("aria-label","Ver "+product.name+" na Shopee (abre em nova aba)");}
  else{link=document.createElement("button");link.type="button";link.disabled=true;link.textContent="Em breve";}
  link.className="cta";body.append(link);card.append(photo,body);grid.append(card);
});
</script>
</body>
</html>
